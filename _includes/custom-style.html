<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

  /* Font experiment: Inter */
  body,
  .post-title,
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family:
      "Inter",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      sans-serif;
  }

  /* --- Blue accent + near-black dark mode (toggle keeps light/dark, starts dark) --- */
  :root {
    --global-theme-color: #c8102e; /* light-mode accent (athletic red, like the shirt logo) */
    --global-hover-color: #c8102e;
  }
  html[data-theme="dark"] {
    --global-bg-color: #0e0e11; /* near-black */
    --global-text-color: #e6e6e6;
    --global-text-color-light: #9aa0a6;
    --global-divider-color: rgba(255, 255, 255, 0.1);
    --global-theme-color: #6190e5; /* true jersey navy (#18263f), brightened for near-black */
    --global-hover-color: #6190e5;
  }

  /* Shared publications styling — applied on the homepage and the /publications/ page */

  /* Section heading case — lowercase to match the site's lowercase nav/aesthetic */
  .post > article > h2 {
    text-transform: lowercase;
  }
  /* Widen publication entries: shrink the badge column, give the space to the text */
  @media (min-width: 576px) {
    .publications .col-sm-2 {
      flex: 0 0 11%;
      max-width: 11%;
      padding-left: 0;
      padding-right: 0;
    }
    .publications .col-sm-8 {
      flex: 0 0 89%;
      max-width: 89%;
      padding-left: 0;
      padding-right: 0;
    }
  }
  /* Colored venue badges: white text, no link underline */
  .publications .badge,
  .publications .badge a,
  .publications .badge div {
    color: #fff;
    text-decoration: none;
  }
  /* Compact badge that shrinks to its label (instead of w-100 + block <div> stretching it),
     with roomy padding like the reference sites so it reads as a comfortable pill. */
  .publications .abbr .badge {
    display: inline-block !important;
    width: auto !important;
    padding: 0.32rem 0.85rem;
    font-size: 72%;
    /* Follow the theme accent so it adapts to light/dark (magenta in light, cyan in dark) */
    background-color: var(--global-theme-color);
  }
  .publications .abbr .badge > div {
    display: inline;
  }
  /* Align publication rows with the surrounding text (remove Bootstrap's -15px gutter overflow) */
  .publications ol.bibliography li .row {
    margin-left: 0;
    margin-right: 0;
  }
  /* Compact, standard-size link buttons (Paper, Abs, ...) */
  .publications .links .btn {
    padding: 0.2rem 0.55rem;
  }
  /* Mobile: stack compact badge on its own line (top), title/authors/venue below */
  @media (max-width: 575.98px) {
    .publications ol.bibliography li .row {
      display: block;
    }
    .publications ol.bibliography li .col.col-sm-2.abbr {
      display: block;
      width: 100%;
      max-width: none;
      padding: 0;
      margin-bottom: 0.5rem;
      text-align: left;
    }
    .publications ol.bibliography li .abbr .badge {
      display: inline-block !important;
      width: auto !important;
    }
    .publications ol.bibliography li [id][class*="col-sm-"] {
      display: block;
      width: 100%;
      max-width: none;
      padding: 0;
    }
  }
</style>
